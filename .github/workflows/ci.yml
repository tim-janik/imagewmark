# Linting: xclip -sel c <.github/workflows/ci.yml # https://rhysd.github.io/actionlint/

on:
  push:
    branches: ['trunk', 'wip/**']
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]
  pull_request:
    branches: ['trunk', 'wip/**']  # Only run PRs targeting these branches

jobs:

  Alpine-CI:
    runs-on: ubuntu-latest
    container: { image: 'ghcr.io/tim-janik/imagewmark-ci:alpine-latest', options: --user runner }
    steps:
    - { uses: actions/checkout@v4.1.1, with: { fetch-depth: 0, submodules: recursive } }
    - run: git fetch -f --tags          # Fix actions/checkout#290
    - run: |
        src/version.sh
        git describe --always --long
    - run: make -j`nproc`
    - run: |
        make -j`nproc` check
    - run: |
        make PREFIX=$HOME install
        make PREFIX=$HOME installcheck
        make PREFIX=$HOME uninstall
    - run: |
        make PREFIX=$HOME distcheck
    - { uses: actions/upload-artifact@v4, with: { name: imagewmark-snapshot, path: 'imagewmark-*.tar.zst' } }

  Ping-IRC:
    # Always run, announce tag and trunk pushes only
    if: ${{ always() && github.event_name == 'push' && (github.ref == 'refs/heads/trunk' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    needs: [ Alpine-CI ]
    steps:
    - { uses: actions/checkout@v4.1.1, with: { fetch-depth: 0 } }
    - run: git fetch -f --tags          # Fix actions/checkout#290
    - name: Ping-IRC
      if: ${{ always() && !env.ACT }}  # IRCBOT_JOBS indicates 'success'
      env: { IRCBOT_JOBS: "${{ join(needs.*.result, ' ') }}" }
      run: .github/workflows/ircbot.py -s irc.libera.chat:6697 -G "#Anklang"
